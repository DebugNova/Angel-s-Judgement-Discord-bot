# Satan + PostgreSQL, fully self-hosted.
#   docker compose up -d --build
#   docker compose logs -f bot
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: satan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: satan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U satan -d satan']
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      EMBEDDED_DB: 'false'
      DATABASE_URL: postgresql://satan:${POSTGRES_PASSWORD:-change-me}@postgres:5432/satan
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
